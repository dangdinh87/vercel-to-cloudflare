name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Script unit tests + SKILL.md / manifest format checks. No network, no npm install.
      - run: node --test scripts/tests/*.test.mjs
